<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<title>Fetchwave Revenue Recovery</title>
<link rel="icon" href="icon192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#F4F5F7;--card:#FFFFFF;--soft:#F6F7F9;--seg:#ECEDF0;--line:#E6E7EA;--line2:#EEEFF2;
  --ink:#111214;--text:#2C2D31;--sub:#4A4C52;--muted:#6C6E75;--faint:#A0A2A9;
  --blue:#1B78D2;--blue-ink:#155FA8;--blue-tint:#E8F1FB;
  --red:#E85036;--red-ink:#B3311A;--red-tint:#FDECE8;
  --ok:#1E8E4A;--ok-ink:#1A7A40;--ok-tint:#E6F6EC;
  --warn:#D08A12;--warn-ink:#8A5300;--warn-tint:#FFF4DE;
  --purple:#7C4FD0;--purple-ink:#5B34A8;--purple-tint:#F1EBFC;--teal-ink:#0B6A61;--teal-tint:#E2F5F2;
  --sh:0 0 0 1px rgba(17,18,20,.05),0 1px 2px rgba(17,18,20,.04),0 8px 20px -10px rgba(17,18,20,.10);
  --font:Geist,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--blue-ink)}a:hover{color:#0F4F8F}
button,input,select,textarea{font:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;background:#fff;border-right:1px solid #EBECEF;padding:20px 14px 16px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand img{width:26px;height:34px;object-fit:contain}
.brand b{display:block;font-size:16px;color:var(--ink);letter-spacing:-.01em}
.org{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:14px;background:var(--soft)}
.org b{font-size:13px;color:var(--ink)}.org span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:14px 14px 6px}
.nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--sub);text-decoration:none}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a.on{background:var(--blue-tint);color:var(--blue-ink);font-weight:600}
.nav a .n{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--red-tint);color:var(--red-ink);font-size:12px;font-weight:600;display:grid;place-items:center}
.nav svg{width:18px;height:18px;flex:none}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid var(--line2)}
.me button.who-btn{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px;border-radius:12px;cursor:pointer;min-width:0;flex:1;text-align:left}
.me button.who-btn:hover{background:var(--soft)}
.av{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.av.soft{background:#EEF1F5;color:var(--text)}
.dotst{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:rgba(244,245,247,.92);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid rgba(17,18,20,.04)}
.top .in{max-width:1200px;margin:0 auto;padding:12px 32px;display:flex;align-items:center;gap:10px}
.top .mlogo{display:none}
.search{position:relative;flex:1;max-width:440px}
.search input{height:40px;width:100%;border:0;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px #E1E2E6;padding:0 14px 0 40px;font-size:14px;color:var(--ink)}
.search input:focus{outline:2px solid var(--blue);outline-offset:1px}
.search>span{position:absolute;left:14px;top:12px;color:var(--muted);display:flex}
.sres{position:absolute;left:0;right:0;top:46px;background:#fff;border-radius:16px;box-shadow:0 0 0 1px rgba(17,18,20,.06),0 18px 40px -12px rgba(17,18,20,.25);overflow:hidden;display:none}
.sres.open{display:block}
.sres a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;text-decoration:none;color:inherit;border-top:1px solid var(--line2)}
.sres a:first-child{border-top:0}
.sres a:hover,.sres a.hl{background:#F6F9FD}
.top .sp{flex:1}
.iconbtn{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:#fff;box-shadow:inset 0 0 0 1px #E1E2E6;display:grid;place-items:center;color:var(--ink);cursor:pointer;flex:none}
.iconbtn:hover{background:var(--soft)}
.iconbtn svg{width:18px;height:18px}
.iconbtn .badge{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.bell{position:fixed;right:32px;top:62px;width:380px;max-width:calc(100vw - 32px);max-height:min(560px,calc(100vh - 90px));overflow:auto;background:#fff;border-radius:18px;box-shadow:0 0 0 1px rgba(17,18,20,.06),0 22px 48px -14px rgba(17,18,20,.3);z-index:45}
.bell .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:#fff}
.bell .it{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;padding:12px 16px;border-top:1px solid var(--line2);text-decoration:none;color:inherit}
.bell .it:hover{background:#F6F9FD}
.bell .it b{display:block;font-size:13px;color:var(--ink)}.bell .it span{font-size:12px;color:var(--sub);line-height:1.4}.bell .it time{display:block;font-size:11px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.bell .it .u{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:5px}
.page{flex:1;padding:24px 32px 64px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.head h1{margin:0;font-size:28px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.head p{margin:6px 0 0;font-size:14px;color:var(--muted)}
/* ---------- parts ---------- */
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh)}
.cb{padding:20px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;flex-wrap:wrap}
.ch h2,.ch h3{margin:0;font-size:17px;font-weight:600;color:var(--ink)}.ch h3{font-size:15px}
.ch span{font-size:13px;color:var(--muted)}
h2.t{margin:0;font-size:17px;font-weight:600;color:var(--ink)}
h3.t{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
.label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--sub);line-height:1.5}
.small{font-size:12px;color:var(--muted);line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:#EEEFF2;color:var(--text)}
.pill.ok{background:var(--ok-tint);color:var(--ok-ink)}.pill.warn{background:var(--warn-tint);color:var(--warn-ink)}.pill.bad{background:var(--red-tint);color:var(--red-ink)}.pill.info{background:var(--blue-tint);color:var(--blue-ink)}.pill.pur{background:var(--purple-tint);color:var(--purple-ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:999px;border:0;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #E1E2E6;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--soft);color:var(--ink)}
.btn.primary{background:var(--blue);color:#fff;box-shadow:none}.btn.primary:hover{background:#1668BA;color:#fff}
.btn.green{background:var(--ok);color:#fff;box-shadow:none}.btn.green:hover{background:#187A3E;color:#fff}
.btn.danger{color:var(--red-ink)}
.btn.wa{color:#145E32;box-shadow:inset 0 0 0 1px #CFE9D8}
.btn.sm{height:30px;padding:0 12px;font-size:12px}
.btn.lg{height:46px;padding:0 22px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--seg);flex-wrap:wrap}
.seg button{height:30px;padding:0 14px;border:0;border-radius:999px;background:transparent;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(17,18,20,.12)}
.seg .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:4px}
.datebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px}
.datebar .l{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.datebar .rng{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink);padding-right:8px}
.f{height:40px;border-radius:12px;border:0;box-shadow:inset 0 0 0 1px #E1E2E6;padding:0 12px;font-size:14px;color:var(--ink);background:#fff;width:100%}
.f:focus{outline:2px solid var(--blue);outline-offset:1px}
textarea.f{height:auto;padding:12px;resize:vertical;min-height:72px;line-height:1.45}
select.f{padding-right:28px}
.f[readonly]{background:var(--soft)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi{padding:20px;display:flex;flex-direction:column;gap:10px}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi .v{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--ink)}
.kpi .h{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;align-items:stretch}
.opt-card{display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid var(--line2);border-radius:14px;background:var(--bg)}.opt-card b{font-size:14px;color:var(--ink)}.opt-card .oh{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px}.opt-card .oa{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:4px}.opt-card .oa>.btn,.opt-card .oa>label.btn,.opt-card .oa>select{height:40px}
.keybox{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.keybox .f{height:36px;font-size:12px}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.row{display:grid;align-items:center;column-gap:16px;padding:0 20px;min-height:60px;border-top:1px solid var(--line2)}
.empty{padding:40px 20px;text-align:center;font-size:14px;color:var(--muted)}
.tw{overflow-x:auto}
.tbl{min-width:1040px}
.thead,.trow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.5fr) minmax(0,1.1fr) 116px 120px minmax(0,1.3fr) 64px 84px;column-gap:14px;align-items:center;padding:0 20px}
.thead{padding-top:12px;padding-bottom:12px}
.trow{min-height:62px;border-top:1px solid var(--line2);text-decoration:none;color:inherit;padding-top:10px;padding-bottom:10px}
a.trow:hover,a.row:hover{background:#F6F9FD;color:inherit}
a.row{text-decoration:none;color:inherit}
.who{display:flex;flex-direction:column;gap:3px;min-width:0}
.who b{font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heat{min-width:34px;height:26px;padding:0 8px;border-radius:999px;display:inline-grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600}
.heatbig{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-weight:600;flex:none}
.sw{width:40px;height:24px;border-radius:999px;border:0;background:#D5D7DC;position:relative;cursor:pointer;flex:none;padding:0}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.sw.on{background:var(--blue)}.sw.on i{left:19px}
.toggle{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line2)}
.toggle:first-child{border-top:0;padding-top:0}
.toggle b{display:block;font-size:14px;color:var(--ink)}.toggle span{font-size:12.5px;color:var(--muted);line-height:1.45}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.stages button{flex:1;min-width:96px;height:40px;border:0;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;background:#F1F2F4;color:var(--sub)}
.stages button.done{background:#DCEBFA;color:var(--blue-ink)}
.stages button.on{background:var(--blue);color:#fff}
.stages button.on.sold{background:var(--ok)}.stages button.on.lost{background:var(--sub)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;height:44px;padding:0 16px;border:0;background:transparent;font-size:14px;font-weight:500;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--blue)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);column-gap:12px;padding:11px 0;border-top:1px solid var(--line2);font-size:13px;align-items:center}
.kv span{color:var(--muted)}.kv b{color:var(--ink);font-weight:600}
.tl{display:grid;grid-template-columns:104px 14px minmax(0,1fr);column-gap:10px;align-items:start;padding:10px 0;border-top:1px solid #F1F2F4}
.tl .t{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:1px}
.tl .dot{margin-top:5px}
.tl b{display:block;font-size:13px;color:var(--ink);font-weight:600}.tl span{font-size:12px;color:var(--muted)}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:14px;font-size:13px;line-height:1.5}
.note.hot{background:var(--warn-tint);color:#6B4000}
.note.info{background:var(--blue-tint);color:var(--blue-ink)}
.note.err{background:var(--red-tint);color:var(--red-ink)}
.note.ok{background:var(--ok-tint);color:#145E32}
.note.grey{background:#EEEFF2;color:var(--sub)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.flow div{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;background:var(--soft);min-height:128px}
.flow div.b{background:var(--blue-tint)}.flow div.r{background:var(--red-tint)}
.flow .n{width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink);box-shadow:0 0 0 1px rgba(17,18,20,.08)}
.flow b{font-size:14px;color:var(--ink)}.flow span{font-size:12px;color:var(--sub);line-height:1.45}
.player{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--soft)}
.player audio{width:100%;height:36px}
.ts{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto;padding-right:4px}
.ts div{display:grid;grid-template-columns:44px 92px minmax(0,1fr);gap:8px;font-size:13px}
.ts .sp{font-weight:600;color:var(--ink)}.ts .sp.c{color:var(--purple-ink)}.ts .sp.a{color:var(--muted);font-weight:500}.ts .sp.a+span{color:var(--muted);font-style:italic}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;font-size:13px}
.checks span{display:flex;align-items:center;gap:8px}
.guide{display:flex;flex-direction:column;gap:0}
.guide label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line2);cursor:pointer;align-items:start}
.guide label:first-child{border-top:0}
.guide input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--ok)}
.guide b{display:block;font-size:14px;color:var(--ink)}.guide span{font-size:12.5px;color:var(--sub);line-height:1.45}
.guide.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}.guide.two label:nth-child(2){border-top:0}
.guide input:checked+div b{color:var(--ok-ink);text-decoration:line-through;text-decoration-color:rgba(26,122,64,.4)}
.code{font-family:var(--mono);font-size:12px;line-height:1.55;background:#14161A;color:#E6E7EA;border-radius:12px;padding:14px;white-space:pre-wrap;word-break:break-all;margin:0;max-height:260px;overflow:auto}
.copyrow{display:flex;gap:8px}.copyrow .f{font-family:var(--mono);font-size:12.5px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--sub);line-height:1.5}
/* stock */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.car{display:flex;flex-direction:column;overflow:hidden;text-decoration:none;color:inherit}
.car .ph{height:150px;background:var(--soft) center/cover no-repeat;display:grid;place-items:center;color:var(--faint);position:relative}
.car .ph .pill{position:absolute;left:12px;top:12px}
.car .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.car .bd b{font-size:15px;color:var(--ink);line-height:1.3}
.car .price{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--ink)}
.car .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.carline{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line2)}
.carline .ph{width:72px;height:50px;border-radius:10px;background:var(--soft) center/cover no-repeat;display:grid;place-items:center;color:var(--faint)}
/* dialler */
.dial{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.outcomes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.outcomes .btn{height:48px;border-radius:14px;font-size:14px}
.progress{height:6px;border-radius:999px;background:var(--seg);overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);border-radius:999px}
/* modals, toasts, sheets */
.modal{position:fixed;inset:0;background:rgba(17,18,20,.36);display:grid;place-items:center;padding:16px;z-index:60}
.modal .card{width:100%;max-width:520px;padding:24px;display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 32px);overflow:auto}
.modal .card.wide{max-width:900px}
.modal h2{margin:0;font-size:20px;color:var(--ink)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:70}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:500;box-shadow:0 12px 32px -8px rgba(0,0,0,.4);max-width:360px}
.sheet{position:fixed;inset:0;background:rgba(17,18,20,.36);z-index:55;display:flex;align-items:flex-end}
.sheet .card{width:100%;border-radius:22px 22px 0 0;padding:12px 12px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.sheet .grip{width:40px;height:5px;border-radius:9px;background:#D5D7DC;margin:2px auto 10px}
.sheet .nav a{height:48px}
.gate{min-height:100vh;display:grid;place-items:center;padding:16px}
.gate .card{width:100%;max-width:400px;padding:28px;display:flex;flex-direction:column;gap:16px}
.gate h1{margin:0;font-size:22px;color:var(--ink)}
.bnav{display:none}
.timer{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-family:var(--mono);font-size:12.5px;font-weight:600;background:var(--ok-tint);color:var(--ok-ink)}
.timer.warn{background:var(--warn-tint);color:var(--warn-ink)}.timer.late{background:var(--red-tint);color:var(--red-ink)}
.srcchip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;background:#F2F3F5;color:var(--text);white-space:nowrap}
.srcchip i{width:6px;height:6px;border-radius:50%}
.do{display:grid;grid-template-columns:44px minmax(0,1fr) auto;column-gap:14px;align-items:center;padding:12px 20px;border-top:1px solid var(--line2);text-decoration:none;color:inherit}
.do:hover{background:#F6F9FD;color:inherit}
.bar{height:8px;border-radius:999px;background:var(--seg);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;border-radius:999px;background:var(--blue)}
@media (max-width:1060px){ .cols,.dial{grid-template-columns:minmax(0,1fr)} }
@media (max-width:860px){
  .side{display:none}
  .top .in{padding:10px 16px}
  .top .mlogo{display:flex;align-items:center}
  .top .mlogo img{width:22px;height:29px}
  .top .hide-m{display:none}
  .top .sp{display:none}
  .search{max-width:none}
  .bell{right:12px;top:62px}
  .page{padding:16px 16px 100px}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #EBECEF;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:40}
  .bnav a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--sub);text-decoration:none}
  .bnav a.on{color:var(--blue-ink)}.bnav svg{width:22px;height:22px}
  .bnav a .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
  .head h1{font-size:24px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .grid2>*{grid-column:auto!important}
  .leadmain{order:-1}
  .guide.two{grid-template-columns:minmax(0,1fr)}.guide.two label:nth-child(2){border-top:1px solid var(--line2)}
  .teamrow{grid-template-columns:34px minmax(0,1fr)!important}.teamrow>*:nth-child(n+3){grid-column:2}
  .kpi{padding:14px}.kpi .v{font-size:20px}
  .kpis:not([style]),.kpis.k3{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .datebar .l{min-width:0;max-width:100%}
  .seg{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
  .hide-sm{display:none}
  .qrow{grid-template-columns:24px 40px minmax(0,1fr) auto!important;column-gap:10px!important}.qrow .qnext{display:none}
  .do .btn{display:none}
  .do{padding:12px 16px}
  .outcomes{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .toasts{left:16px;right:16px;bottom:84px}
}
@media print{
  .side,.top,.bnav,.toasts,.noprint,.datebar .seg{display:none!important}
  body,html{background:#fff}
  .page{padding:0}
  .card{box-shadow:none;border:1px solid #E6E7EA;break-inside:avoid}
}
</style>

    case '30d': return [today - 29 * D, now + 60e3];

  await navigator.serviceWorker.ready;

/* ================= Calls ================= */
const CALL_TABS = [['all', 'All', () => true], ['sales', 'Sales', (c) => c.direction !== 'inbound' || !c.department || c.department === 'Sales'], ['missed', 'Missed', (c) => ['missed', 'abandoned'].includes(c.status)], ['recovered', 'Recovered', (c) => c.status === 'recovered'], ['out', 'Outbound', (c) => c.direction !== 'inbound'], ['dept', 'Other departments', (c) => c.status === 'routed']];
function vCalls() {

  const tab = CALL_TABS.find((t) => t[0] === S.callTab) || CALL_TABS[0];

  const inbound = base.filter((c) => c.direction === 'inbound' && c.status !== 'routed');
  const answered = inbound.filter((c) => !['missed', 'abandoned', 'recovered', 'returned'].includes(c.status));
  const scored = base.filter((c) => c.ai_score != null);
  const cols = 'grid-template-columns:120px minmax(0,1.3fr) 140px minmax(0,1fr) 72px 64px 160px';

    <div class="card kpi"><span class="label">Missed, then recovered</span><span class="v">${base.filter((c) => c.status === 'recovered').length}<span style="font-size:16px;color:var(--muted)"> / ${base.filter((c) => ['missed', 'recovered', 'returned'].includes(c.status)).length}</span></span><span class="h">automatic callbacks that connected</span></div>
    <div class="card kpi"><span class="label">Average call score</span><span class="v">${scored.length ? Math.round(scored.reduce((a, c) => a + c.ai_score, 0) / scored.length) : '—'}</span><span class="h">${scored.length} calls reviewed</span></div>
  </div>

    <div class="tw"><div style="min-width:900px">
      <div style="display:grid;${cols};column-gap:14px;padding:14px 20px"><span class="label">When</span><span class="label">Buyer</span><span class="label">Type</span><span class="label">Handled by</span><span class="label">Length</span><span class="label">Score</span><span class="label">Status</span></div>
      ${calls.length ? calls.map((c) => { const l = lead(c.lead_id), m = member(c.member_id); const kb = c.callback_id ? S.callbacks.find((b) => b.id === c.callback_id) : null; const type = c.direction === 'inbound' ? (c.status === 'routed' ? `To ${c.department || 'department'}` : 'Inbound') : c.direction === 'callback' ? (kb?.kind === 'lead' ? 'Lead Connect' : 'Auto callback') : 'Outbound';

}

/* ================= Recovery ================= */
function vRecovery() {
  const st = S.org?.settings || {}, r = st.recovery || {};
  const cbs = S.callbacks.filter((b) => inR(b.created_at));
  const missedCbs = cbs.filter((b) => b.kind !== 'lead'), leadCbs = cbs.filter((b) => b.kind === 'lead');
  const missed = S.calls.filter((c) => ['missed', 'recovered', 'returned'].includes(c.status) && inR(c.created_at));
  const after = missed.filter((c) => !openAt(c.created_at));
  const repeat = S.calls.filter((c) => c.flag === 'repeat' && inR(c.created_at));
  const L = S.leads.filter((l) => inR(l.created_at));
  const merged = L.filter((l) => l.merged), slow = L.filter((l) => l.speed_flags);
  const matchTasks = S.tasks.filter((t) => t.source === 'Stock match' && inR(t.created_at));
  const soldOf = (arr) => rand(arr.filter(Boolean).reduce((a, l) => a + saleValue(l), 0));
  const leadsOf = (list) => [...new Set(list.map((x) => x.lead_id))].map(lead).filter(Boolean);
  const avgConnect = leadCbs.filter((b) => b.connect_sec != null);
  const on = (key) => key === 'connect' ? st.connect?.enabled !== false : r[key] !== false;
  const card = (key, name, whenTxt, then, caught, saved, sold, mode = 'live') => `<section class="card cb" style="display:flex;flex-direction:column;gap:12px;${mode === 'later' ? 'opacity:.72' : ''}">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><b style="font-size:15px;color:var(--ink)">${name}</b>${mode === 'live' ? `<button class="sw ${on(key) ? 'on' : ''}" data-act="rec" data-v="${key}" aria-label="Switch ${name} on or off" ${isMgr() ? '' : 'disabled'}><i></i></button>` : mode === 'info' ? '<span class="pill ok">Always on</span>' : mode === 'list' ? '<a class="pill info" href="#/calllist" style="text-decoration:none">In the call list</a>' : '<span class="pill">Coming next</span>'}</div>
    <span class="small"><b style="color:var(--sub)">When</b> ${whenTxt}</span><span class="small"><b style="color:var(--sub)">Then</b> ${then}</span>
    ${caught != null ? `<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:12px;border-top:1px solid var(--line2);margin-top:auto"><div style="display:flex;flex-direction:column;gap:2px"><span class="label" style="font-size:10px">Caught</span><span class="mono" style="font-size:15px;font-weight:600;color:var(--ink)">${caught}</span></div><div style="display:flex;flex-direction:column;gap:2px"><span class="label" style="font-size:10px">Saved</span><span class="mono" style="font-size:15px;font-weight:600;color:var(--ok-ink)">${saved}</span></div><div style="display:flex;flex-direction:column;gap:2px"><span class="label" style="font-size:10px">Sold</span><span class="mono" style="font-size:15px;font-weight:600;color:var(--ink)">${sold}</span></div></div>` : ''}
  </section>`;
  return head('Recovery', 'Every way a sale slips away, caught automatically. Salespeople just work their list.') + dateBar() + `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px">
    ${card('missed', 'Missed call', 'a call rings out, or voicemail or call screening picks up', `the salesperson's phone rings to call back after ${st.callback?.first || 2} minutes, again at ${st.callback?.retry || 10}, then the manager is alerted`, missed.length, missedCbs.filter((b) => b.status === 'recovered').length, soldOf(leadsOf(missedCbs.filter((b) => b.status === 'recovered'))))}
    ${card('connect', 'Lead Connect', 'a lead arrives from AutoTrader, Cars.co.za, Facebook or the website', `the salesperson's phone rings straight away: "New lead, press 1 to call them"${avgConnect.length ? `. Average time to buyer: ${mins(avgConnect.reduce((a, b) => a + b.connect_sec, 0) / avgConnect.length * 1000)}` : ''}`, leadCbs.length, leadCbs.filter((b) => b.status === 'recovered').length, soldOf(leadsOf(leadCbs.filter((b) => b.status === 'recovered'))))}
    ${card('missed', 'After-hours call', 'someone calls while the showroom is closed', 'their callback is booked for opening time, and they are the first call of the day', after.length, after.filter((c) => c.status === 'recovered').length, soldOf(leadsOf(after.filter((c) => c.status === 'recovered'))), 'info')}
    ${card('repeat', 'Repeat caller', 'the same number calls twice or more within 2 hours without getting through', 'flagged as a frustrated buyer, heat raised, manager alerted', repeat.length, repeat.filter((c) => lead(c.lead_id)?.first_contact_at).length, soldOf(leadsOf(repeat)))}
    ${card('speed', 'Lead not contacted', 'nobody contacts a new lead', `alert at ${st.speed?.alert || 2} minutes, manager at ${st.speed?.manager || 5}, reassigned at ${st.speed?.reassign || 10}`, slow.length, slow.filter((l) => l.first_contact_at).length, soldOf(slow))}
    ${card('merge', 'Shopping around', 'the same person enquires on two or more sources', 'merged into one lead, heat raised, called first', merged.length, merged.filter((l) => l.first_contact_at).length, soldOf(merged))}
    ${card('nostep', 'No next step', 'a call ends with nothing booked', 'a follow-up task is created from the call for the next day', S.tasks.filter((t) => t.source === 'From the call' && inR(t.created_at)).length, S.tasks.filter((t) => t.source === 'From the call' && t.done_at && inR(t.created_at)).length, '—')}
    ${card('stock', 'Stock match', 'a car arrives that a past or open buyer wanted', 'their salesperson gets a task and an alert with the buyer and the car', matchTasks.length, matchTasks.filter((t) => t.done_at).length, soldOf(leadsOf(matchTasks)))}
    ${card('quiet', 'Gone quiet', 'an open buyer has had no movement for 3 days', 'they land in the "Gone quiet" call list to work through', null, null, null, 'list')}
    ${card('revive', 'Lost lead revival', 'a lead was lost 3 weeks to 4 months ago (not bought elsewhere)', 'they land in the "Lost to revive" call list, and reopen if they call', null, null, null, 'list')}
    ${card('noshow', 'No-show', 'an appointment passes without the buyer arriving', 'a same-day rebooking task', null, null, null, 'later')}
  </div>`;
}

/* ================= Lead sources ================= */
function srcRows() {
  const spend = S.org?.settings?.money?.spend || {};
  const target = (S.org?.settings?.speed?.target || 5) * 60e3;
  const L = S.leads.filter((l) => inR(l.created_at));
  return SOURCES.map((s) => { const r = L.filter((l) => (l.sources?.length ? l.sources : [l.source]).includes(s)); const c = r.filter((l) => l.first_contact_at); const fast = c.filter((l) => T(l.first_contact_at) - T(l.created_at) <= target).length; const sold = r.filter((l) => l.stage === 'sold');
    return { s, n: r.length, fast: c.length ? Math.round(fast / c.length * 100) : null, appts: r.filter((l) => l.appt_at || ['appointment', 'testdrive', 'finance', 'sold'].includes(l.stage)).length, sold: sold.length, gross: sold.reduce((a, l) => a + (+l.gross || 0), 0), spend: +spend[s] || 0 }; }).filter((x) => x.n || x.spend);
}
function vSources() {
  const target = S.org?.settings?.speed?.target || 5;
  const rows = srcRows();
  const merged = S.leads.filter((l) => inR(l.created_at) && l.merged).length;
  const cols = 'grid-template-columns:minmax(0,1.3fr) 130px repeat(5,minmax(0,1fr)) 110px;column-gap:14px';
  return head('Lead sources', 'What each source costs, and which ones actually sell cars') + dateBar() + `
  <section class="card" style="overflow:hidden"><div class="tw"><div style="min-width:920px">
    <div style="display:grid;${cols};padding:16px 20px 12px"><span class="label">Source</span><span class="label">Monthly spend</span><span class="label" style="text-align:right">Leads</span><span class="label" style="text-align:right">Within ${target} min</span><span class="label" style="text-align:right">Appointments</span><span class="label" style="text-align:right">Sold</span><span class="label" style="text-align:right">Gross</span><span class="label" style="text-align:right">Cost per sale</span></div>
    ${rows.length ? rows.map((x) => `<div class="row" style="${cols}">
      <span style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--ink)"><i class="dot" style="width:10px;height:10px;background:${SRC_C[x.s]}"></i>${x.s}</span>
      <input class="f mono" data-spend="${x.s}" value="${x.spend || ''}" placeholder="R" inputmode="numeric" style="height:34px" aria-label="Monthly spend on ${x.s}" ${isMgr() ? '' : 'disabled'}>
      <span class="mono" style="text-align:right">${x.n}</span><span class="mono" style="text-align:right;font-weight:600;color:${x.fast == null ? 'var(--muted)' : x.fast >= 75 ? 'var(--ok-ink)' : 'var(--warn-ink)'}">${x.fast == null ? '—' : x.fast + '%'}</span><span class="mono" style="text-align:right">${x.appts}</span><span class="mono" style="text-align:right;font-weight:600">${x.sold}</span><span class="mono" style="text-align:right">${rand(x.gross)}</span><span class="mono" style="text-align:right">${x.spend && x.sold ? rand(x.spend / x.sold) : '—'}</span></div>`).join('') : '<div class="empty" style="border-top:1px solid var(--line2)">No leads in this period yet.</div>'}
  </div></div></section>
  <div class="grid2">
    <section class="card cb" style="display:flex;flex-direction:column;gap:10px"><h2 class="t">Buyers merged across sources</h2><div style="display:flex;align-items:baseline;gap:10px"><span class="mono" style="font-size:30px;font-weight:600;color:var(--ink)">${merged}</span><span class="small">seen on two or more sources</span></div><span class="hint">Each portal only sees its own enquiry. You see the person, and that they are shopping around right now.</span></section>
    <section class="card cb" style="display:flex;flex-direction:column;gap:10px"><h2 class="t">Teach Facebook who actually buys</h2><span class="hint">Sends each Facebook lead's outcome back to Meta (contacted, appointment, sold) so the ads look for buyers instead of form-fillers.</span><span class="pill" style="align-self:flex-start">Switches on when the dealership's Facebook page is connected</span></section>
  </div>`;
}

/* ================= Monthly report (prints to PDF) ================= */
function vReport() {
  const L = S.leads.filter((l) => inR(l.created_at));
  const C = S.calls.filter((c) => inR(c.created_at));
  const sold = S.leads.filter((l) => l.stage === 'sold' && inR(l.closed_at));
  const M = moneyNow();
  const contacted = L.filter((l) => l.first_contact_at);
  const target = (S.org?.settings?.speed?.target || 5) * 60e3;
  const missed = C.filter((c) => ['missed', 'recovered', 'returned'].includes(c.status));
  const scored = C.filter((c) => c.ai_score != null);
  const coach = {}; scored.forEach((c) => (c.ai_feedback?.improve || []).forEach((t) => { const k = t.replace(/\.$/, ''); coach[k] = (coach[k] || 0) + 1; }));
  const topCoach = Object.entries(coach).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const checkRate = guide().map((g) => ({ g, n: scored.filter((c) => c.checks?.[g.key]).length }));
  const reps = S.members.filter((m) => m.role !== 'reception').map((m) => { const ml = L.filter((l) => l.owner_id === m.id); const mc = ml.filter((l) => l.first_contact_at); const ms = scored.filter((c) => c.member_id === m.id); return { m, leads: ml.length, avg: mc.length ? mc.reduce((a, l) => a + T(l.first_contact_at) - T(l.created_at), 0) / mc.length : null, calls: C.filter((c) => c.member_id === m.id).length, score: ms.length ? Math.round(ms.reduce((a, c) => a + c.ai_score, 0) / ms.length) : null, sold: sold.filter((l) => l.owner_id === m.id).length, gross: sold.filter((l) => l.owner_id === m.id).reduce((a, l) => a + (+l.gross || 0), 0) }; });
  const rows = srcRows();
  const maxN = Math.max(1, ...rows.map((r) => r.n));
  const big = (label, v, h) => `<div class="card kpi"><span class="label">${label}</span><span class="v">${v}</span>${h ? `<span class="h">${h}</span>` : ''}</div>`;
  return head('Monthly report', `${esc(S.org?.name || '')} · ${rangeLabel()}`, `<button class="btn primary noprint" data-act="print">${ic('print')}Save as PDF</button>`) + `<div class="noprint">${dateBar()}</div>
  <div class="kpis k3">
    ${big('Recovered revenue', `<span style="color:var(--ok-ink)">${rand(M.recValue)}</span>`, `${M.rec.length} sale${M.rec.length === 1 ? '' : 's'} won back · ${rand(M.recGross)} gross`)}
    ${big('Leads', L.length, `${L.filter((l) => l.merged).length} buyer${L.filter((l) => l.merged).length === 1 ? '' : 's'} seen on 2+ sources`)}
    ${big('Contacted within target', contacted.length ? Math.round(contacted.filter((l) => T(l.first_contact_at) - T(l.created_at) <= target).length / contacted.length * 100) + '%' : '—', `average ${contacted.length ? mins(contacted.reduce((a, l) => a + T(l.first_contact_at) - T(l.created_at), 0) / contacted.length) : '—'}`)}
    ${big('Missed calls recovered', missed.length ? Math.round(missed.filter((c) => c.status === 'recovered').length / missed.length * 100) + '%' : '—', `${missed.filter((c) => c.status === 'recovered').length} of ${missed.length}`)}
    ${big('Sales in the DMS', M.all.length, `${rand(M.value)} · ${M.all.length ? Math.round(M.matched.length / M.all.length * 100) : 0}% from a tracked lead`)}
    ${big('Average call score', scored.length ? Math.round(scored.reduce((a, c) => a + c.ai_score, 0) / scored.length) : '—', `${scored.length} calls reviewed`)}
  </div>
  <div class="grid2">
    <section class="card cb" style="display:flex;flex-direction:column;gap:10px"><h2 class="t">Leads by source</h2>${rows.length ? rows.map((r) => `<div style="display:grid;grid-template-columns:110px minmax(0,1fr) 40px 70px;gap:10px;align-items:center;font-size:13px"><span style="display:flex;align-items:center;gap:8px"><i class="dot" style="background:${SRC_C[r.s]}"></i>${r.s}</span><div class="bar"><i style="width:${Math.round(r.n / maxN * 100)}%;background:${SRC_C[r.s]}"></i></div><span class="mono" style="text-align:right">${r.n}</span><span class="mono small" style="text-align:right">${r.sold} sold</span></div>`).join('') : '<span class="small">No leads in this period.</span>'}</section>
    <section class="card cb" style="display:flex;flex-direction:column;gap:10px"><h2 class="t">What calls cover</h2>${checkRate.map((x) => `<div style="display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;font-size:13px"><span>${esc(x.g.title)}</span><div class="bar"><i style="width:${scored.length ? Math.round(x.n / scored.length * 100) : 0}%"></i></div><span class="mono" style="text-align:right">${scored.length ? Math.round(x.n / scored.length * 100) + '%' : '—'}</span></div>`).join('')}${topCoach.length ? `<div class="note hot" style="margin-top:4px"><span><b>Most common coaching points:</b> ${topCoach.map(([t, n]) => `${esc(t)} (${n})`).join(' · ')}</span></div>` : ''}</section>
  </div>
  <section class="card" style="overflow:hidden"><div class="ch"><h2>By salesperson</h2></div><div class="tw"><div style="min-width:720px">
    <div style="display:grid;grid-template-columns:minmax(0,1.4fr) repeat(6,minmax(0,1fr));column-gap:12px;padding:0 20px 10px"><span class="label">Salesperson</span><span class="label" style="text-align:right">Leads</span><span class="label" style="text-align:right">First contact</span><span class="label" style="text-align:right">Calls</span><span class="label" style="text-align:right">Call score</span><span class="label" style="text-align:right">Sold</span><span class="label" style="text-align:right">Gross</span></div>
    ${reps.map((x) => `<div class="row" style="grid-template-columns:minmax(0,1.4fr) repeat(6,minmax(0,1fr));column-gap:12px;min-height:50px"><b style="font-size:14px;color:var(--ink)">${esc(x.m.name)}</b><span class="mono" style="text-align:right">${x.leads}</span><span class="mono" style="text-align:right;color:${x.avg != null && x.avg <= target ? 'var(--ok-ink)' : 'var(--text)'}">${x.avg != null ? mins(x.avg) : '—'}</span><span class="mono" style="text-align:right">${x.calls}</span><span class="mono" style="text-align:right">${x.score ?? '—'}</span><span class="mono" style="text-align:right;font-weight:600">${x.sold}</span><span class="mono" style="text-align:right">${rand(x.gross)}</span></div>`).join('')}

/* ================= Phones & routing ================= */
function vPhones() {
  if (!isMgr()) return '<div class="card empty">Only managers can change how calls ring.</div>';
  const st = S.org?.settings || {}, ring = Number(st.ring_seconds || 15), cn = st.connect || {}, ivr = st.ivr || { enabled: false, options: [] };
  const opts = (ivr.options && ivr.options.length ? ivr.options : [{ digit: '1', label: 'Sales', dept: 'sales' }]);
  return head('Phones & routing', "Calls ring the right salesperson on the dealership's own phones") + `
  <section class="card cb" style="display:flex;flex-direction:column;gap:16px"><h2 class="t">What happens when a buyer calls</h2>
    <div class="flow"><div><span class="n">1</span><b>Buyer calls a tracking number</b><span>One number per source tells you which ad made the phone ring</span></div>
    <div><span class="n">2</span><b>${ivr.enabled ? 'Phone menu' : 'Short greeting'}</b><span>${ivr.enabled ? 'Sales, service or parts. Only sales calls become leads' : 'Says the call is recorded, then rings straight away'}</span></div>
    <div class="b"><span class="n">3</span><b>Their salesperson first</b><span>Known buyers ring their own salesperson. Press 1 to take the call</span></div>
    <div class="b"><span class="n">4</span><b>Next free salesperson</b><span>Round-robin, ${ring} seconds each, skipping anyone away or on a call</span></div>
    <div><span class="n">5</span><b>Reception</b><span>The last stop before a call counts as missed</span></div>
    <div class="r"><span class="n">6</span><b>Missed, then recovered</b><span>A salesperson's phone rings to call back after ${st.callback?.first || 2} minutes, again at ${st.callback?.retry || 10}, then the manager is alerted</span></div></div></section>
  <div class="grid2">
    <section class="card" style="overflow:hidden"><div class="ch"><h2>Ringing order</h2><span>Switch someone off to skip them</span></div>
      ${S.members.map((m, i) => `<div class="row" style="grid-template-columns:22px minmax(0,1fr) 128px 72px 40px"><span class="mono" style="font-size:13px;color:var(--muted)">${i + 1}</span><div class="who" style="padding:10px 0"><b>${esc(m.name)}</b><span class="mono">${esc(m.phone || 'No phone number')}</span></div>
        <button class="btn sm" style="width:100%" data-act="away" data-id="${m.id}">${m.status === 'away' ? 'Mark available' : 'Mark away'}</button>
        <span style="display:flex;gap:4px"><button class="btn sm" data-act="up" data-id="${m.id}" aria-label="Move ${esc(m.name)} up">↑</button><button class="btn sm" data-act="down" data-id="${m.id}" aria-label="Move ${esc(m.name)} down">↓</button></span>
        <button class="sw ${m.in_rotation ? 'on' : ''}" data-act="rot" data-id="${m.id}" aria-label="Include ${esc(m.name)} in the ringing order"><i></i></button></div>`).join('')}
      <form data-form="ring" class="row" style="grid-template-columns:minmax(0,1fr) 110px auto;padding:14px 20px"><span class="hint">Ring each person for</span><input class="f mono" name="ring_seconds" type="number" min="8" max="40" value="${ring}" aria-label="Seconds"><button class="btn sm" type="submit">Save</button></form>
    </section>
    <section class="card cb" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2 class="t">Lead Connect</h2><button class="sw ${cn.enabled !== false ? 'on' : ''}" data-act="rec" data-v="connect" aria-label="Lead Connect on or off"><i></i></button></div>
      <span class="hint">When a lead arrives from AutoTrader, Cars.co.za, Facebook or the website, the salesperson's phone rings within seconds: "New AutoTrader lead, Sipho, about the 2021 Ranger. Press 1 to call him." Then the buyer is dialled and the call is recorded. Outside trading hours it rings at opening time.</span>
      <form data-form="connect" class="fgrid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
        <label class="field"><span class="label">Tries</span><input class="f mono" name="attempts" type="number" min="1" max="4" value="${cn.attempts || 2}"></label>
        <label class="field"><span class="label">Next try after (min)</span><input class="f mono" name="retry" type="number" min="1" max="30" value="${cn.retry || 3}"></label>
        <button class="btn" type="submit" style="height:40px">Save</button>
      </form>
      <span class="small">A second try goes to the next free salesperson, so a lead never waits on one person.</span>
    </section>
  </div>
  <div class="grid2">
    <section class="card cb" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h2 class="t">Phone menu</h2><button class="sw ${ivr.enabled ? 'on' : ''}" data-act="ivr-toggle" aria-label="Phone menu on or off"><i></i></button></div>
      <span class="hint">Optional. "For sales, press 1. For service, press 2." Service and parts calls go straight to their number and don't become leads. Leave it off if the number is sales-only, since every step loses some callers.</span>
      <form data-form="ivr" style="display:flex;flex-direction:column;gap:8px">
        ${opts.map((o, i) => `<div style="display:grid;grid-template-columns:56px minmax(0,1fr) minmax(0,1.2fr) 34px;gap:8px;align-items:center"><input class="f mono" name="digit${i}" value="${esc(o.digit)}" maxlength="1" aria-label="Key" style="text-align:center"><input class="f" name="label${i}" value="${esc(o.label)}" aria-label="Department" ${o.dept === 'sales' ? 'readonly' : ''}><input class="f mono" name="number${i}" value="${esc(o.number || '')}" placeholder="${o.dept === 'sales' ? 'Rings the sales team' : 'Number or sip: address'}" aria-label="Number" ${o.dept === 'sales' ? 'readonly' : ''}>${o.dept === 'sales' ? '<span></span>' : `<button class="btn sm" type="button" data-act="ivr-del" data-v="${i}" aria-label="Remove">×</button>`}</div>`).join('')}
        <div style="display:flex;gap:8px;justify-content:space-between"><button class="btn sm" type="button" data-act="ivr-add" ${opts.length >= 6 ? 'disabled' : ''}>${ic('plus', 14)}Add a department</button><button class="btn primary sm" type="submit">Save menu</button></div>
      </form>
    </section>
    <section class="card" style="overflow:hidden"><div class="ch"><h2>Tracking numbers</h2><span>Calls to each number are tagged with its source</span></div>
      ${S.lines.map((n) => `<div class="row" style="grid-template-columns:minmax(0,1fr) auto"><span style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink)"><i class="dot" style="background:${SRC_C[n.source] || '#8D9097'}"></i>${esc(n.source)}</span><span class="mono" style="font-size:13px;color:var(--sub)">${esc(n.number)}</span></div>`).join('')}
      <form class="row" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;padding:14px 20px" data-form="line"><input class="f mono" name="number" placeholder="+27…" required aria-label="Number"><select class="f" name="source" aria-label="Source">${SOURCES.map((s) => `<option>${s}</option>`).join('')}</select><button class="btn" type="submit">Add</button></form>
    </section>
  </div>
  <section class="card cb" style="display:flex;flex-direction:column;gap:12px"><h2 class="t">Using the dealership's existing phones</h2>
    <div class="grid2">
      <div style="display:flex;flex-direction:column;gap:8px"><b style="font-size:14px;color:var(--ink)">Desk phones on their phone system</b><span class="hint">In Team, set a person's phone to their desk number, or to their phone-system address, for example <span class="mono">sip:201@dealer.pbx.co.za</span>. Most systems (Euphoria, 3CX, Yeastar) give each extension one. Their desk phone then rings like a cellphone would.</span></div>
      <div style="display:flex;flex-direction:column;gap:8px"><b style="font-size:14px;color:var(--ink)">Missed calls on the main number</b><span class="hint">Ask their phone provider to forward the main number to the tracking number when nobody answers (after 20 seconds, busy or after hours). Those calls then get the same automatic callback, and nothing changes for callers who get through.</span></div>
    </div></section>`;
}

/* ================= Connections ================= */

function vConnections() {
  if (!isMgr()) return '<div class="card empty">Only managers can manage connections.</div>';
  const key = S.org?.intake_key || '';
  const st = S.org?.settings || {}, feed = st.stock_feed || {}, wh = st.webhook || {};
  const emails7 = S.inbox.filter((x) => x.channel === 'email' && Date.now() - T(x.created_at) < 7 * 86400e3);
  const fb7 = S.inbox.filter((x) => x.channel === 'facebook' && Date.now() - T(x.created_at) < 7 * 86400e3);
  const formSnippet = `<form action="${ENGINE}?route=intake&key=${key}" method="POST">
  <input type="hidden" name="source" value="Website">
  <input type="hidden" name="redirect" value="https://YOUR-SITE/thank-you">
  <input name="name" placeholder="Your name" required>
  <input name="phone" placeholder="Cellphone" required>
  <input name="email" type="email" placeholder="Email">
  <input name="vehicle" placeholder="Car you're interested in">
  <textarea name="message" placeholder="Message"></textarea>
  <input name="website" style="display:none" tabindex="-1" autocomplete="off">
  <button type="submit">Send</button>
</form>`;
  const tp = S.parseTest;
  return head('Connections', 'Where leads come in from, and what the system sends out') + `
  <section class="card cb" style="display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><h2 class="t">AutoTrader, Cars.co.za and other lead emails</h2>${emails7.length ? statusPill(`${emails7.length} received this week`, 'ok') : statusPill('Waiting for the first email', 'warn')}</div>

    ${copyRow('emailhook', `${ENGINE}?route=email&key=${key}`)}

    <form data-form="email-address" class="fgrid" style="grid-template-columns:minmax(0,1fr) auto"><label class="field"><span class="label">The forwarding address, once you have it (for the team's reference)</span><input class="f mono" name="addr" value="${esc(st.intake_email || '')}" placeholder="leads@inbound.yourdomain.co.za"></label><button class="btn" type="submit" style="height:40px">Save</button></form>
  </section>
  <section class="card cb" style="display:flex;flex-direction:column;gap:14px">
    <h2 class="t">Test with a real lead email</h2>
    <form data-form="parse" style="display:flex;flex-direction:column;gap:10px">
      <div class="fgrid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))"><label class="field"><span class="label">From</span><input class="f" name="from" value="${esc(tp?.input?.from || '')}" placeholder="leads@autotrader.co.za"></label><label class="field"><span class="label">Subject</span><input class="f" name="subject" value="${esc(tp?.input?.subject || '')}" placeholder="New lead for 2021 Ford Ranger"></label></div>
      <label class="field"><span class="label">Email text</span><textarea class="f" name="text" rows="6" placeholder="Paste the whole email here">${esc(tp?.input?.text || '')}</textarea></label>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" type="submit">Read it</button></div>
    </form>
    ${tp?.out ? `<div class="note ${tp.out.ok ? 'ok' : 'err'}" style="flex-direction:column;gap:8px"><b>${tp.out.ok ? 'This would create a lead:' : "We couldn't find a phone number or email in it."}</b>
      <div class="fgrid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:6px 16px;color:var(--text)">${[['Source', tp.out.source], ['Name', tp.out.name], ['Phone', tp.out.phone], ['Email', tp.out.email], ['Car', tp.out.vehicle], ['Stock number', tp.out.stock_ref], ['Message', tp.out.message]].map(([k, v]) => `<div><span class="label">${k}</span><div style="font-size:13px;font-weight:600;color:${v ? 'var(--ink)' : 'var(--faint)'}">${esc(v || 'Not found')}</div></div>`).join('')}</div>
      ${tp.out.ok ? '<div style="display:flex;gap:8px"><button class="btn sm primary" data-act="parse-create">Create this lead</button><span class="small" style="align-self:center">Send the sample email to Fetchwave if a field is wrong, and the reader gets adjusted.</span></div>' : ''}</div>` : ''}
  </section>
  <div class="grid2">
    <section class="card cb" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><h2 class="t">Facebook Lead Ads</h2>${fb7.some((x) => x.status !== 'needs_review') ? statusPill('Receiving leads', 'ok') : fb7.length ? statusPill('Needs the page token', 'bad') : statusPill('Not connected yet', 'warn')}</div>
      <span class="hint">Instant-form leads arrive in seconds, with the form answers and campaign name.</span>
      ${copyRow('fbhook', `${ENGINE}?route=fb&key=${key}`, 'Webhook address (Meta app → Webhooks → Page → leadgen)')}
      ${copyRow('fbtoken', key, 'Verify token')}
      <span class="small">Fetchwave adds the page access token as a server secret (FB_PAGE_TOKEN) once the dealership's page is connected.</span>
    </section>
    <section class="card cb" style="display:flex;flex-direction:column;gap:12px">
      <h2 class="t">Website enquiry form</h2>
      <span class="hint">Give this to their web developer. Replace their form's address, or paste the whole form. Works without JavaScript.</span>
      <pre class="code" id="snippet">${esc(formSnippet)}</pre>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="copy-pre" data-v="snippet">Copy form</button><button class="btn sm" data-act="copy-text" data-v="${esc(`${ENGINE}?route=intake&key=${key}`)}">Copy address only (Zapier, Make)</button></div>
    </section>
  </div>
  <section class="card" style="overflow:hidden"><div class="ch"><h2>Received</h2><span>The last emails and Facebook leads, and what happened to each</span></div>
    ${S.inbox.length ? S.inbox.slice(0, 20).map((x) => `<div class="row" style="grid-template-columns:110px 90px minmax(0,1fr) auto;min-height:54px"><span class="mono small">${esc(when(x.created_at))}</span><span class="srcchip">${x.channel === 'facebook' ? 'Facebook' : 'Email'}</span><div class="who"><b style="font-size:13px">${esc(x.subject || x.sender || '')}</b><span>${esc(x.note || (x.parsed ? [x.parsed.name, x.parsed.phone, x.parsed.vehicle].filter(Boolean).join(' · ') : ''))}</span></div>${x.lead_id ? `<a class="pill ${x.status === 'merged' ? 'warn' : 'ok'}" href="#/lead/${x.lead_id}" style="text-decoration:none">${x.status === 'merged' ? 'Merged into buyer' : 'Lead created'}</a>` : statusPill('Needs a look', 'bad')}</div>`).join('') : '<div class="empty">Nothing received yet.</div>'}
  </section>
  <div class="grid2">
    <section class="card cb" style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><h2 class="t">Stock feed</h2>${feed.last_at ? statusPill(`Updated ${ago(feed.last_at)}`, 'ok') : feed.url ? statusPill('Not synced yet', 'warn') : statusPill('Not connected', 'warn')}</div>
      <span class="hint">The address of the dealership's stock list from their website provider, DMS or portal export (CSV, JSON or XML). It updates every morning at 06:00, and cars missing from the feed are marked sold.</span>
      <form data-form="feed" class="fgrid" style="grid-template-columns:minmax(0,1fr) 120px auto">
        <label class="field"><span class="label">Feed address</span><input class="f mono" name="url" value="${esc(feed.url || '')}" placeholder="https://…/stock.xml"></label>
        <label class="field"><span class="label">Format</span><select class="f" name="format">${['auto', 'csv', 'json', 'xml'].map((f) => `<option value="${f}" ${(feed.format || 'auto') === f ? 'selected' : ''}>${f === 'auto' ? 'Detect' : f.toUpperCase()}</option>`).join('')}</select></label>
        <button class="btn" type="submit" style="height:40px">Save</button>
      </form>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn sm primary" data-act="feed-sync" ${feed.url ? '' : 'disabled'}>Update now</button>${feed.last_result ? `<span class="small">Last update: ${feed.last_result.total} cars · ${feed.last_result.added} new · ${feed.last_result.sold} marked sold</span>` : ''}<a class="btn sm" href="#/stock">Open stock</a></div>
    </section>
    <section class="card cb" style="display:flex;flex-direction:column;gap:12px">
      <h2 class="t">DMS and other systems</h2>
      <span class="hint"><b>Sales in:</b> the DMS emails its daily deals report, or a file is uploaded, on the <a href="#/sales">Sales</a> page. Every deal is matched to its lead and credited automatically.</span>
      <span class="hint"><b>Updates out:</b> we can send every new lead, stage change and finished call to another system (their DMS, CRM or a Zapier hook) as it happens.</span>
      <form data-form="webhook" class="fgrid" style="grid-template-columns:minmax(0,1fr) auto"><label class="field"><span class="label">Send updates to</span><input class="f mono" name="url" value="${esc(wh.url || '')}" placeholder="https://hooks.zapier.com/…"></label><button class="btn" type="submit" style="height:40px">Save</button></form>
      ${copyRow('whsecret', S.org?.webhook_secret || '', 'Signing secret (X-Fetchwave-Signature is an HMAC-SHA256 of the body)')}
      <span class="small">Events: lead.created, lead.stage_changed, lead.assigned, call.done, call.missed, call.recovered, call.no_answer.</span>
    </section>
  </div>
  <section class="card cb" style="display:flex;flex-direction:column;gap:10px">
    <h2 class="t">Click to call from any website</h2>
    <span class="hint">A small Chrome add-on for salespeople. Every phone number on AutoTrader, Cars.co.za, the DMS or any web page gets a call button. Clicking it opens this app, rings their phone, dials the buyer and records the call against the lead.</span>
    <ol class="steps"><li>Download <a href="fetchwave-click-to-call.zip" download>fetchwave-click-to-call.zip</a> and unzip it.</li><li>In Chrome, open <span class="mono">chrome://extensions</span>, switch on Developer mode, choose "Load unpacked" and pick the folder.</li><li>In the add-on's options, paste this app's address: <span class="mono">${esc(location.origin + location.pathname)}</span></li></ol>
  </section>`;
}

/* ================= Settings ================= */
function vSettings() {
  if (!isMgr()) return '<div class="card empty">Only managers can change settings.</div>';
  const st = S.org?.settings || {}, h = st.hours || {}, cb = st.callback || {}, sp = st.speed || {}, al = st.alerts || {};
  const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  return head('Settings', 'Trading hours, timings, alerts and the call guide') + `
  <section class="card cb"><h2 class="t" style="margin-bottom:14px">Trading hours and timings</h2>
    <form data-form="settings" style="display:flex;flex-direction:column;gap:16px">
      <div class="field"><span class="label">Open days</span><div style="display:flex;gap:6px;flex-wrap:wrap">${DAYS.map((d, i) => `<label class="pill" style="height:34px;padding:0 14px;cursor:pointer"><input type="checkbox" name="day" value="${i}" ${(h.days || [1, 2, 3, 4, 5, 6]).includes(i) ? 'checked' : ''} style="margin:0 4px 0 0">${d}</label>`).join('')}</div></div>
      <div class="fgrid" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
        <label class="field"><span class="label">Opens</span><input class="f mono" type="time" name="open" value="${esc(h.open || '08:00')}"></label>
        <label class="field"><span class="label">Closes</span><input class="f mono" type="time" name="close" value="${esc(h.close || '17:00')}"></label>
        <label class="field"><span class="label">Missed call: first callback (min)</span><input class="f mono" type="number" min="1" max="60" name="cb_first" value="${esc(cb.first || 2)}"></label>
        <label class="field"><span class="label">Missed call: retry after (min)</span><input class="f mono" type="number" min="2" max="120" name="cb_retry" value="${esc(cb.retry || 10)}"></label>
        <label class="field"><span class="label">Speed-to-lead target (min)</span><input class="f mono" type="number" min="1" max="60" name="sp_target" value="${esc(sp.target || 5)}"></label>
        <label class="field"><span class="label">Remind salesperson after (min)</span><input class="f mono" type="number" min="1" max="60" name="sp_alert" value="${esc(sp.alert || 2)}"></label>
        <label class="field"><span class="label">Alert the manager after (min)</span><input class="f mono" type="number" min="1" max="120" name="sp_manager" value="${esc(sp.manager || 5)}"></label>
        <label class="field"><span class="label">Reassign after (min)</span><input class="f mono" type="number" min="2" max="240" name="sp_reassign" value="${esc(sp.reassign || 10)}"></label>
      </div>
      <div style="display:flex;justify-content:flex-end"><button class="btn primary" type="submit">Save settings</button></div>
    </form></section>
  <section class="card cb"><h2 class="t" style="margin-bottom:6px">Alerts</h2>
    <div class="toggle"><div><b>Phone alerts</b><span>New leads, missed calls, frustrated buyers, flagged calls and stock matches pop up on each person's phone. Everyone switches it on for their own phone from their name, bottom left.</span></div><button class="sw ${al.push !== false ? 'on' : ''}" data-act="alert-toggle" data-v="push" aria-label="Phone alerts"><i></i></button></div>
    <div class="toggle"><div><b>Email alerts to managers</b><span>The same manager alerts, also by email. Fetchwave switches on the email sender (RESEND_API_KEY) before this works.</span></div><button class="sw ${al.email ? 'on' : ''}" data-act="alert-toggle" data-v="email" aria-label="Email alerts"><i></i></button></div>
  </section>
  <section class="card cb"><h2 class="t" style="margin-bottom:4px">Call guide</h2><p class="hint" style="margin:0 0 12px">Shown to salespeople during every call, and the same six points the call score checks. Change the words to how this dealership talks.</p>
    <form data-form="guide" style="display:flex;flex-direction:column;gap:10px">${guide().map((g, i) => `<div style="display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1.6fr);gap:10px;align-items:start"><span class="mono" style="padding-top:10px;color:var(--muted)">${i + 1}</span><input class="f" name="title_${g.key}" value="${esc(g.title)}" aria-label="Point ${i + 1}"><textarea class="f" name="say_${g.key}" rows="2" aria-label="What to say">${esc(g.say)}</textarea></div>`).join('')}
    <div style="display:flex;justify-content:space-between;gap:8px"><button class="btn sm" type="button" data-act="guide-reset">Back to the default words</button><button class="btn primary" type="submit">Save call guide</button></div></form>
  </section>`;
}

const VIEWS = { today: vToday, do: vDo, leads: vLeads, lead: vLead, calllist: vCallList, dial: vDial, stock: vStock, calls: vCalls, recovery: vRecovery, money: vSales, sales: vSales, cold: vCold, archive: vArchive, sources: vSources, report: vReport, team: vTeam, phones: vPhones, connections: vConnections, settings: vSettings };

/* ================= modals ================= */
function mwrap(inner, wide) { return `<div class="modal" data-act="close-modal"><div class="card ${wide ? 'wide' : ''}">${inner}</div></div>`; }
const mfoot = (btn) => `<div class="mfoot"><button class="btn" type="button" data-act="close-modal">Cancel</button>${btn}</div>`;
function normPreview(r) {
  const pick = (keys) => { for (const k of Object.keys(r)) { const n = k.toLowerCase().replace(/[^a-z0-9]/g, ''); if (keys.includes(n) && String(r[k]).trim()) return r[k]; } return ''; };
  const year = pick(['year', 'modelyear', 'regyear']), make = pick(['make', 'manufacturer', 'brand']), model = pick(['model', 'modelname']), variant = pick(['variant', 'derivative', 'series', 'trim']);
  return { ref: pick(['ref', 'stocknumber', 'stockno', 'stockid', 'stockcode', 'reference', 'id', 'vin']), title: pick(['title', 'name', 'description', 'vehicle', 'heading']) || [year, make, model, variant].filter(Boolean).join(' '), make, model, year: +String(year).replace(/\D/g, '') || null, price: money(pick(['price', 'sellingprice', 'retailprice', 'amount', 'cashprice'])), km: money(pick(['km', 'mileage', 'odometer', 'kilometres', 'kilometers'])), colour: pick(['colour', 'color']), photo_url: pick(['photo', 'image', 'imageurl', 'mainimage', 'photourl', 'picture', 'thumbnail']) || null, url: pick(['url', 'link', 'permalink', 'listingurl']) || null, kind: /new/i.test(pick(['condition', 'newused', 'type', 'kind'])) ? 'new' : /demo/i.test(pick(['condition', 'newused', 'type', 'kind'])) ? 'demo' : 'used' };
}

  e.preventDefault();
  try {
  switch (a) {
    case 'signout': if (S.demo) { S.modal = null; gate(); break; } await sb.auth.signOut(); S.session = null; S.modal = null; location.hash = ''; render(); break;
    case 'demo-signin': gate(); break;

    case 'profile': await openProfile(); break;

    case 'read-all': { const now = new Date().toISOString(); await sb.from('notifications').update({ read_at: now }).is('read_at', null).eq('member_id', S.me.id); S.notes.forEach((n) => { n.read_at = n.read_at || now; }); render(); break; }

    const b = route === 'email_test' ? (() => { const p = demoParse(body); return { name: p.name, phone: p.phone, email: p.email, source: p.source, vehicle: p.vehicle, message: p.message }; })() : body;
    const hit = DB.leads.find((l) => (b.phone && phoneKey(l.phone) === phoneKey(b.phone) && phoneKey(b.phone).length === 9) || (b.email && l.email && l.email.toLowerCase() === b.email.toLowerCase()));
    if (hit) { if (!hit.sources.includes(b.source)) hit.sources.push(b.source); hit.merged = hit.sources.filter((s) => s !== 'Phone').length > 1; if (hit.merged) hit.heat = Math.min(99, hit.heat + 10); return route === 'email_test' ? { ok: true, id: hit.id, merged: true } : { lead: hit, isNew: false }; }
    const lead = { id: 'x' + Math.random().toString(36).slice(2), org_id: 'demo-org', ref: Math.max(...DB.leads.map((l) => l.ref)) + 1, name: b.name || 'New buyer', phone: b.phone ? e164(b.phone) : null, email: b.email || null, source: b.source || 'Manual', sources: [b.source || 'Manual'], vehicle: b.vehicle || null, message: b.message || null, stage: 'new', owner_id: S.me.id, heat: 60, merged: false, created_at: new Date().toISOString(), updated_at: new Date().toISOString() };
    DB.leads.unshift(lead); DB.activity.unshift({ id: 'x' + Date.now(), org_id: 'demo-org', lead_id: lead.id, kind: 'lead', text: `New lead from ${lead.source}${lead.vehicle ? ': ' + lead.vehicle : ''} · assigned to ${first(S.me.name)}`, created_at: lead.created_at });
    return route === 'email_test' ? { ok: true, id: lead.id, merged: false } : { lead, isNew: true };
  }
  if (route === 'sales_key') return { key: 'preview-only-key', url: ENGINE + '?route=sales' };
  if (route === 'sale_confirm') { const sl = DB.sales.find((x) => x.id === body.sale_id), l = DB.leads.find((x) => x.id === body.lead_id); if (!sl || !l) throw new Error('Not found'); Object.assign(sl, { state: 'matched', lead_id: l.id, match_by: 'confirmed by ' + S.me.name, match_score: 100, candidates: null, recovered: !!l.recovered_by, credit: l.recovered_by ? 'Reassigned when nobody called' : l.source + ' lead', credit_member_id: l.owner_id, credit_at: l.created_at, lead_source: l.source }); Object.assign(l, { stage: 'sold', sale_id: sl.id, gross: sl.gross, closed_at: new Date().toISOString(), sale_source: 'dms' }); return { ok: true, sale: sl }; }
  if (route === 'sale_walkin') { const sl = DB.sales.find((x) => x.id === body.sale_id); if (sl) Object.assign(sl, { state: 'walkin', lead_id: null, match_by: 'not a lead', candidates: null }); return { ok: true }; }
  if (route === 'sales_import') throw new Error('Preview only: sign in to match a real sales file.');
  if (route === 'parse_test') return demoParse(body);

    const items = body.rows.map(normPreview).filter((c) => c.title); let added = 0, updated = 0;
    for (const it of items) { const ref = it.ref || it.title; const ex = DB.stock.find((c) => c.ref === ref); if (ex) { Object.assign(ex, it, { ref, status: 'available' }); updated++; } else { DB.stock.unshift({ id: 'x' + Math.random().toString(36).slice(2), org_id: 'demo-org', ...it, ref, status: 'available', source: 'import', arrived_at: new Date().toISOString(), created_at: new Date().toISOString() }); added++; } }
    let sold = 0; if (body.full) { const refs = new Set(items.map((i) => i.ref || i.title)); DB.stock.forEach((c) => { if (c.status === 'available' && !refs.has(c.ref)) { c.status = 'sold'; sold++; } }); }

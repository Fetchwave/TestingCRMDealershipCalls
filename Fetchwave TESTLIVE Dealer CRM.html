/* ===================== events ===================== */
function refresh(){ render(); renderDrawer(); }
document.addEventListener('click', e=>{
  const t=e.target.closest('[data-act]'); if(!t) return; const a=t.dataset.act, id=t.dataset.id;
  if(['lead-q','arch-q','lead-src','lead-owner','stage-sel','owner-sel','role-sel','toggle','check','task-done'].includes(a)) return;
  if(a==='stop'){ e.stopPropagation(); return; }
  if(a==='modal-bg'){ if(e.target===t) closeModal(); return; }
  e.stopPropagation();
  switch(a){
    case 'go': S.view=t.dataset.v; closeDrawer(); closeModal(); render(); document.getElementById('main').scrollTop=0; break;
    case 'role': S.role=t.dataset.v; closeDrawer(); if(document.querySelector('.sheet-list')) moreSheet(); render(); break;
    case 'more': moreSheet(); break;
    case 'today-tab': S.todayTab=t.dataset.v; render(); break;
    case 'arch-tab': S.archTab=t.dataset.v; render(); break;
    case 'stock-tab': S.stockTab=t.dataset.v; render(); break;
    case 'open-stock': modalStock(id); break;
    case 'sim-sold': simSold(); break;
    case 'undo-archive': case 'restore': { const l=lead(id); l.archived=false; l.stage=(l.prevStage&&!['sold','lost'].includes(l.prevStage))?l.prevStage:'contacted'; log(l, a==='undo-archive'?'Close undone':'Reopened from Archive', 'var(--blue)'); if(l.stage!=='lost'){ const st=stockOf(l); if(st && st.status==='sold' && st.soldAt && Date.now()-st.soldAt<WEEK && a==='undo-archive'){ st.status='available'; } } l.value=undefined; l.lostReason=undefined; t.closest('.toast')?.remove(); toast(`${esc(l.name)} is back on the board in ${STAGES.find(s=>s.id===l.stage).name}.`); refresh(); break; }
    case 'open-lead': closeModal(); openDrawer('lead', id); break;
    case 'open-call': openDrawer('call', id); break;
    case 'close': closeDrawer(); break;
    case 'sim-lead': simLead(); break;
    case 'sim-call': simCall(); break;
    case 'click-call': clickToCall(lead(id)); break;
    case 'contact': { const l=lead(id); const was=!l.first; markFirst(l, t.dataset.how, !was); log(l, `${t.dataset.how} sent`, 'var(--blue)'); if(!was) toast(`${t.dataset.how} logged.`); refresh(); break; }
    case 'appt': modalAppt(lead(id)); break;
    case 'return-call': { const c=call(id); c.returned=true; if(c.lead){ const l=lead(c.lead); log(l,'Missed call returned','var(--blue)'); } toast(`Calling ${c.lead?esc(lead(c.lead).name):esc(c.from)} back from the ${SRC[c.line].name} line. Recorded.`, 'phoneOut'); refresh(); break; }
    case 'lead-from-call': { const c=call(id); const l={id:'L'+(1300+simN++), name:'New caller '+c.from.slice(-4), phone:c.from, email:'—', src:c.line==='main'?'walk':c.line, created:c.at, stage:'new', owner:EXECS[rr++%4], first:null, vehicle:{name:'Not captured yet',stock:'—',price:0,kind:'—'}, track:{by:`Called the ${SRC[c.line].name} line ${SRC[c.line].line}`, campaign:'Phone call', ad:'—', form:`Called the ${SRC[c.line].name} line`, landing:'—', device:'Phone', utm:'(call tracking)'}, answers:[['How they reached us',`Called ${SRC[c.line].line}`]], log:[]}; log(l,`Lead created from a missed call on the ${SRC[c.line].name} line`, SRC[c.line].c); LEADS.unshift(l); c.lead=l.id; toast('Lead created. The source is set from the line they called.'); openDrawer('lead', l.id); render(); break; }
    case 'add-note': { const l=lead(id), ta=document.getElementById('note-'+id); if(ta.value.trim()){ log(l, 'Note: '+ta.value.trim(), 'var(--purple)'); ta.value=''; refresh(); } break; }
    case 'call-tab': S.callTab=t.dataset.v; render(); break;
    case 'range': S.range=+t.dataset.v; render(); break;
    case 'play': togglePlay(); break;
    case 'seek': { const c=call(S.drawer.id), r=t.getBoundingClientRect(); P.pos=Math.max(0,Math.min(c.dur,(e.clientX-r.left)/r.width*c.dur)); paintPlayer(); break; }
    case 'jump': P.pos=+t.dataset.t; if(!P.playing) togglePlay(); else paintPlayer(); break;
    case 'speed': P.speed=+t.dataset.v; document.querySelectorAll('.speed button').forEach(b=>b.classList.toggle('on', +b.dataset.v===P.speed)); break;
    case 'score': { const c=call(id); c.score=+t.dataset.v; renderDrawer(); break; }
    case 'flag': { const c=call(id); c.note=document.getElementById('cnote-'+id).value; c.review = c.review==='flagged'?'needs':'flagged'; toast(c.review==='flagged'?`Flagged for coaching. ${c.by?TEAM[c.by].short+' can see your note.':''}`:'Flag removed.'); refresh(); break; }
    case 'reviewed': { const c=call(id); if(!c.score){ toast('Give the call a score out of 5 first.','info'); break; } c.note=document.getElementById('cnote-'+id).value; c.review='reviewed'; toast(`Reviewed · ${c.score}/5. Saved to ${c.by?TEAM[c.by].short+"'s":'the'} scorecard.`); refresh(); break; }
    case 'add-lead': modalWalkIn(); break;
    case 'walkin-ok': { const n=document.getElementById('w-name').value.trim(); if(!n){ toast('Add a name to save the lead.','info'); break; } const l={id:'L'+(1400+simN++), name:n, phone:document.getElementById('w-phone').value||'—', email:'—', src:'walk', created:Date.now(), stage:'contacted', owner:S.role==='exec'?S.exec:EXECS[rr++%4], first:Date.now(), firstHow:'In person', vehicle:{name:document.getElementById('w-veh').value||'Not captured yet',stock:'—',price:0,kind:'—'}, track:{by:'Added by the salesperson', campaign:'Walk-in', ad:'—', form:'Added in CRM', landing:'—', device:'—', utm:'(walk-in)'}, answers:[['How they reached us','Walked into the showroom']], log:[]}; l.firstBy=l.owner; log(l,'Walk-in added','var(--faint)'); LEADS.unshift(l); closeModal(); toast(`${esc(n)} added.`); refresh(); break; }
    case 'sold-ok': { const l=lead(id); const v=+String(document.getElementById('m-val').value).replace(/[^\d]/g,''); l.value=v||l.vehicle.price; closeModal(); applyStage(l,'sold', R(l.value)); break; }
    case 'reason': S._reason=t.dataset.v; document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on', b===t)); break;
    case 'lost-ok': { if(!S._reason){ toast('Pick a reason so it shows in the reports.','info'); break; } const l=lead(id); l.lostReason=S._reason; closeModal(); applyStage(l,'lost', S._reason); break; }
    case 'appt-ok': { const l=lead(id); l.appt=`${document.getElementById('m-when').value} — ${document.getElementById('m-type').value.toLowerCase()}`; markFirst(l,'Call',true); closeModal(); log(l, `Appointment: ${l.appt}`, 'var(--blue)'); if(['new','contacted'].includes(l.stage)) applyStage(l,'appointment'); else { toast('Appointment booked.'); refresh(); } break; }
    case 'modal-close': closeModal(); break;
    case 'noop-invite': toast('Invites send a sign-up email once the live version is connected.','info'); break;
  }
});
document.addEventListener('change', e=>{
  const t=e.target; const a=t.dataset.act;
  if(a==='lead-src'){ S.board.src=t.value; render(); }
  if(a==='lead-owner'){ S.board.owner=t.value; render(); }
  if(a==='stage-sel'){ moveStage(t.dataset.id, t.value); }
  if(a==='owner-sel'){ const l=lead(t.dataset.id); l.owner=t.value; log(l, `Reassigned to ${TEAM[t.value].short}`, 'var(--faint)'); toast(`Reassigned to ${TEAM[t.value].short}. They've been notified.`); refresh(); }
  if(a==='role-sel'){ S.role=t.value; closeDrawer(); render(); }
  if(a==='toggle'){ S.setting[t.dataset.id]=t.checked; }
  if(a==='check'){ const c=call(t.dataset.id); c.checks[t.dataset.k]=t.checked; renderDrawer(); }
  if(a==='task-done'){ const tk=TASKS.find(x=>x.id===t.dataset.id); tk.done=t.checked; tk.doneAt=Date.now(); const l=lead(tk.lead); if(l) log(l, (t.checked?'Task done: ':'Task reopened: ')+tk.text, t.checked?'var(--ok)':'var(--faint)'); if(t.checked) toast('Task done. It leaves Today and stays on the lead.'); setTimeout(refresh, 250); }
});
document.addEventListener('input', e=>{ if(e.target.dataset.act==='arch-q'){ S.archQ=e.target.value; const pos=e.target.selectionStart; render(); const q=document.getElementById('arch-q'); q.focus(); q.setSelectionRange(pos,pos); return; } if(e.target.dataset.act==='lead-q'){ S.board.q=e.target.value; const pos=e.target.selectionStart; render(); const q=document.getElementById('lead-q'); q.focus(); q.setSelectionRange(pos,pos); } });
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(document.getElementById('modal').innerHTML) closeModal(); else closeDrawer(); } });

/* live timers */
setInterval(()=>{
  const now=Date.now();
  document.querySelectorAll('[data-since]').forEach(el=>{ const ms=now-(+el.dataset.since);
    if(el.dataset.big){ el.textContent=dur(ms); el.classList.remove('ok','warn','late'); el.classList.add(tclass(ms)||'ok'); return; }
    el.querySelector('span').textContent=dur(ms); el.classList.remove('warn','late'); const c=tclass(ms); if(c) el.classList.add(c); });
}, 1000);

render();
</script>
